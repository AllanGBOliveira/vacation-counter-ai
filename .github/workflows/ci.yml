name: CI Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # postinstall roda automaticamente: nuxt prepare
      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # postinstall roda automaticamente: nuxt prepare
      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # postinstall roda automaticamente: nuxt prepare
      - name: Install dependencies
        run: npm ci

      - name: Test build
        run: npm run generate

      - name: Check output
        run: |
          if [ ! -d ".output/public" ]; then
            echo "❌ Build failed - no output directory"
            exit 1
          fi
          echo "✅ Build successful!"


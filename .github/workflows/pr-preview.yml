name: PR Preview

on:
  pull_request:
    branches:
      - main

jobs:
  preview:
    name: Build Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # postinstall roda automaticamente: nuxt prepare
      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Generate preview build
        run: npm run generate

      - name: Get build size
        id: build-size
        run: |
          SIZE=$(du -sh .output/public | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      - name: Comment PR with preview info
        uses: actions/github-script@v7
        with:
          script: |
            const size = '${{ steps.build-size.outputs.size }}';
            const comment = `## 📦 Preview Build Completed
            
            ✅ Build successful!
            📊 Build size: **${size}**
            
            Changes will be deployed to GitHub Pages after this PR is merged to \`main\`.
            
            ### Next Steps:
            1. Review the code changes
            2. Approve the PR if everything looks good
            3. Merge to trigger automatic deployment
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })


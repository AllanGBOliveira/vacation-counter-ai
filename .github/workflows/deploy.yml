name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite deploy manual se necessário

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Roda os checks novamente antes do deploy
  pre-deploy-checks:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # postinstall roda automaticamente: nuxt prepare
      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Test build
        run: npm run generate

  build-and-deploy:
    name: Build & Deploy
    needs: pre-deploy-checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # postinstall roda automaticamente: nuxt prepare
      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        env:
          # ✅ Variáveis públicas (configure em Settings > Secrets and variables > Actions > Variables)
          NUXT_PUBLIC_APP_NAME: ${{ vars.APP_NAME || 'Vacation Counter AI' }}
          NUXT_PUBLIC_APP_VERSION: ${{ vars.APP_VERSION || '1.0.0' }}
          NUXT_PUBLIC_BASE_URL: ${{ vars.BASE_URL || '/vacation-counter-ai/' }}
          NUXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.example.com' }}
          NUXT_PUBLIC_API_TIMEOUT: ${{ vars.API_TIMEOUT || '30000' }}
          NUXT_PUBLIC_ENABLE_ANALYTICS: ${{ vars.ENABLE_ANALYTICS || 'false' }}
          NUXT_PUBLIC_ENABLE_DEBUG: ${{ vars.ENABLE_DEBUG || 'false' }}
          NUXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
          
          # 🔒 Secrets (configure em Settings > Secrets and variables > Actions > Secrets)
          # Use para tokens/keys necessários apenas durante o build
          # SECRET_BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: npm run generate

      - name: Add .nojekyll file
        run: touch .output/public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment URL
        run: |
          echo "🚀 Site deployed successfully!"
          echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"

